<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Telegram MTProto Userbot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .card {
      background: #1e293b;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      font-size: 24px;
    }

    .description {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.8;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #cbd5e1;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 15px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #0f172a;
      color: #fff;
      outline: none;
      font-size: 14px;
      direction: ltr;
      text-align: left;
    }

    input:focus {
      border-color: #38bdf8;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 5px;
    }

    #loginBtn {
      background: #229ed9;
      color: white;
    }

    #loginBtn:hover {
      opacity: 0.9;
    }

    #logoutBtn {
      background: #ef4444;
      color: white;
    }

    .status {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      background: #0f172a;
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.7;
      word-break: break-word;
    }

    .success {
      border: 1px solid #22c55e;
      color: #86efac;
    }

    .error {
      border: 1px solid #ef4444;
      color: #fca5a5;
    }

    .loading {
      border: 1px solid #38bdf8;
      color: #7dd3fc;
    }

    #botPanel {
      display: none;
    }

    .panel-box {
      background: #0f172a;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 18px;
      line-height: 1.9;
    }

    .panel-box strong {
      color: #38bdf8;
    }

    .commands {
      direction: ltr;
      text-align: left;
      background: #020617;
      padding: 12px;
      border-radius: 10px;
      font-family: monospace;
      font-size: 12px;
      line-height: 2;
      overflow-x: auto;
    }

    .warning {
      color: #fbbf24;
      font-size: 12px;
      line-height: 1.8;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- LOGIN -->
    <div
      class="card"
      id="loginSection"
    >

      <h1>
        Telegram MTProto Userbot
      </h1>

      <div class="description">
        ورود به حساب تلگرام و اجرای
        ارسال خودکار پیام در گروه‌ها
      </div>

      <label for="apiId">
        API ID
      </label>

      <input
        id="apiId"
        type="number"
        placeholder="API ID"
        autocomplete="off"
      />

      <label for="apiHash">
        API Hash
      </label>

      <input
        id="apiHash"
        type="text"
        placeholder="API Hash"
        autocomplete="off"
      />

      <label for="phone">
        شماره تلفن
      </label>

      <input
        id="phone"
        type="text"
        placeholder="+989xxxxxxxxx"
        autocomplete="off"
      />

      <label for="session">
        Session String
      </label>

      <input
        id="session"
        type="text"
        placeholder="در صورت داشتن Session"
        autocomplete="off"
      />

      <button
        id="loginBtn"
        type="button"
      >
        ورود به تلگرام
      </button>

      <div
        id="status"
        class="status"
      >
        آماده ورود
      </div>

    </div>


    <!-- USERBOT PANEL -->
    <div
      class="card"
      id="botPanel"
    >

      <h1>
        Userbot فعال است
      </h1>

      <div class="panel-box">

        <strong>
          دستورات:
        </strong>

        <div class="commands">
word=میو time=4 on

word=هی time=2 edit

word off

.list

.stopall
        </div>

      </div>

      <div class="panel-box">

        <strong>
          وضعیت:
        </strong>

        <div>
          اتصال به تلگرام برقرار است.
        </div>

      </div>

      <div class="warning">
        ⚠️ برای اجرای زمان‌بندی‌ها باید
        صفحه و اتصال تلگرام فعال بماند.
      </div>

      <br />

      <button
        id="logoutBtn"
        type="button"
      >
        خروج از تلگرام
      </button>

    </div>

  </div>

</body>
</html>
